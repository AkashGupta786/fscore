<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* Reset */
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

/* Body */
body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

/* Form Container */
form{
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 350px;
}

/* Labels */
label{
    color: white;
    font-size: 15px;
    font-weight: 500;
}

/* Inputs */
input{
    padding: 12px;
    border: none;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    transition: 0.3s ease;
}

input:focus{
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
    transform: scale(1.02);
}

/* Button */
button{
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: #764ba2;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover{
    background: #764ba2;
    color: white;
    transform: translateY(-2px);
}

/* Score Box */
#score{
    margin-top: 20px;
    width: 350px;
    min-height: 80px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
</style>
<body>
    <form action="">
        <label for="p1">person1</label>
        <input type="text"  id="p1" required>
        <label for="p2">person2</label>
        <input type="text"  id="p2" required>
        <button>submit</button>
    </form>
    <div id="score">
        
    </div>
    <script src="script.js"></script>
</body>
</html>
